  scl: 21
  scan: True

# - platform: sh1107_i2c
# model: SH1107 128X128
display:
  - platform: ssd1306_i2c
    model: 'SH1107_128x128'
    flip_x: false
    flip_y: false
    offset_y: 0
    offset_x: 0
    external_vcc: true
    update_interval: 1s
    id: my_displayu
    rotation: 270
    lambda: |-
      
      //it.printf(it.get_width()/2,8,id(my_font),TextAlign::CENTER,"< %d / %d >",id(current_menu)+1,id(menu_count));
      it.print(it.get_width()/2,8,id(my_font),TextAlign::CENTER,"< switchbox >");
      it.line(0,16,it.get_width(),16);
      if (id(is_sleep)) {
        it.print(it.get_width()/2,60,id(my_font),TextAlign::CENTER,"SLEEP");  
        return;
      }
      auto menu=id(menus)[id(current_menu)];
      if (menu) it.menu(0,17,menu,it.get_width(),it.get_height()-17);
      else it.print(it.get_width()/2,60,id(my_font),TextAlign::CENTER,"NO MENU");
