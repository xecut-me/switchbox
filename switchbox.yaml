text_sensor:
  - platform: uptime
    id: ts_uptime
  - platform: wifi_info
    ip_address: 
      id: ts_ip
    
graphical_display_menu:
  - id: status_menu
    font: roboto_20
    active: False
    mode: joystick  
    items:
      - type: label
        text: !lambda |-
          char str[64];
          time_t t = id(ha_time).timestamp_now();
          struct tm *tmp = localtime(&t);
          strftime(str,sizeof(str),"%Y-%m-%d %H:%M:%S", tmp);
          return std::string(str);
      - type: label
        text: !lambda |-
          return "Uptime " + id(ts_uptime).state;
      - type: label
        text: !lambda |-
          return "IP: " + id(ts_ip).state;
      - type: label
        text: !lambda |-
          return id(is_sleep) ? "SLEEP" : "AWAKE";
  - id: my_menu
    font: roboto_20
    active: False
    mode: joystick  
    items:
      - type: switch
        switch: lr_3
        text: "Main"
        immediate_edit: True
      - type: switch
        switch: lr_1
        text: "Rear"
        immediate_edit: True
      - type: switch
        switch: lr_2
        text: "Rear Wall"
        immediate_edit: True
      - type: switch
        switch: sw_table
        immediate_edit: True
        text: Table
  - id: my_menu2
    font: roboto_20
    active: False
    mode: joystick  
    items:
      - type: number
        number: n_template1
        immediate_edit: True
      - type: number
        number: n_template2
        immediate_edit: True
      - type: number
        number: n_template3
        immediate_edit: True
      - type: number
        number: n_template4
        immediate_edit: True
      - type: number
        number: n_template5
        immediate_edit: True
      - type: number
        number: n_template6
        immediate_edit: True

switch_array:
  - pins: [7,5,3,1,18,14]
    on_key:
      - lambda: |-
          if(id(is_sleep)) return;
          auto menu=id(menus)[id(current_menu)];
          menu->select(pos);
          auto it = menu->get_item(pos);
          it->select_prev();
  - pins: [6,4,2,23,19,15]
    on_key:
      - lambda: |-
          if(id(is_sleep)) return;
          auto menu=id(menus)[id(current_menu)];
          menu->select(pos);
          auto it = menu->get_item(pos);
          it->select_next();

binary_sensor:

  - platform: template
    name: sw_is_sleep
    lambda: |-
      return id(is_sleep);

  - platform: gpio
    pin: 
      number: 0
      mode: INPUT_PULLUP
      inverted: True
    name: "0 SLEEP"
    internal: True
    id: sw_sleep

  - platform: gpio
    pin: 
      number: 13
      mode: INPUT_PULLUP
      inverted: True
    id: dir_l
    name: "13 L"
    on_press: 
      - lambda: |-
          if(id(is_sleep)) return;
          id(current_menu)=(id(current_menu)?id(current_menu):id(menu_count))-1;

        

  - platform: gpio
    pin: 
      number: 20
      mode: INPUT_PULLUP
      inverted: True
    id: dir_r
    name: "20 R"
    on_press: 
      - lambda: |-
          if(id(is_sleep)) return;
          id(current_menu)=(id(current_menu)+1)%id(menu_count);


  - platform: gpio
    pin: 
      number: 8
      mode: INPUT_PULLUP
      inverted: True
    id: dir_d
    name: "8"
    on_press:
      - lambda: |-
          if(id(is_sleep)) return;
          auto menu=id(menus)[id(current_menu)];
          menu->down();

  - platform: gpio
    pin: 
      number: 9
      mode: INPUT_PULLUP
      inverted: True
    id: dir_u
    name: "9"
    on_press:
      - lambda: |-
          if(id(is_sleep)) return;
          auto menu=id(menus)[id(current_menu)];
          menu->up();


switch:
  - platform: homeassistant
    entity_id: light.space_light_relay_3
    id: lr_3
  - platform: homeassistant
    entity_id: light.space_light_relay_1
    id: lr_1
  - platform: homeassistant
    entity_id: light.space_light_relay_2
    id: lr_2

  - platform: homeassistant
    entity_id: switch.table_power
    id: sw_table
