esphome:
  name: switchbox
  friendly_name: switchbox
  on_boot:
    - lambda: |-
        int a=42;
        static graphical_display_menu::GraphicalDisplayMenu* menulist[] = {status_menu};
        id(menus)=menulist;
        id(menu_count)=sizeof(menulist)/ sizeof(*menulist);
        id(deep_sleep1).prevent_deep_sleep();
        id(is_sleep)=false;

  on_shutdown: 
    - lambda: |-
          ESP_LOGE("SLEEP","Preparing for sleep");
          int pin = 0;
          bool level = 1;
          const auto gpio_pin = gpio_num_t(0);
          // gpio_set_direction(gpio_pin, GPIO_MODE_INPUT);
          gpio_hold_en(gpio_pin);
          // Internal pullup/pulldown resistors are enabled automatically, when
          // ESP_SLEEP_GPIO_ENABLE_INTERNAL_RESISTORS is set (by default it is)
          esp_deep_sleep_enable_gpio_wakeup(1 << pin,static_cast<esp_deepsleep_gpio_wake_up_mode_t>(level));
          ESP_LOGE("SLEEP","Preparing for sleep DONE");

  on_loop: 
    - lambda: |-
        id(is_sleep)=id(sw_sleep).state;
        if (id(is_sleep)){
          id(deep_sleep1).allow_deep_sleep();
        }else{
          id(deep_sleep1).prevent_deep_sleep();
        }

        

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

safe_mode:
  disabled: True

deep_sleep:
  id: deep_sleep1
  run_duration: 30sec
  sleep_duration: 10min


external_components:
  - source: components

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0  # Disables logging output to USB/UART

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

  on_client_connected: 
    - lambda: |-
        static graphical_display_menu::GraphicalDisplayMenu* menulist[] = {my_menu,my_menu2,status_menu};
        id(menus)=menulist;
        id(menu_count)=sizeof(menulist)/ sizeof(*menulist);

  on_client_disconnected: 
    - lambda: |-
        static graphical_display_menu::GraphicalDisplayMenu* menulist[] = {status_menu};
        id(menus)=menulist;
        id(menu_count)=sizeof(menulist)/ sizeof(*menulist);
    

ota:
  - platform: esphome
    password: !secret ota_key

web_server:
  version: 3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  # ap:
    # ssid: "Switchbox Fallback Hotspot"
    # password: "6s8GAM3UQ6Ed"

# captive_portal:
    


globals:
    - id: current_menu
      type: int
      restore_value: no
      initial_value: '0'   

    # - id: menus
    #   type: int
    #   restore_value: no
    #   initial_value: '0);Component* menulist[]={my_menu, my_menu2}; int menucount=sizeof(menulist'
    - id: menus
      type: graphical_display_menu::GraphicalDisplayMenu**
      restore_value: no

    - id: menu_count
      type: int
      restore_value: no  

    - id: is_sleep
      type: bool
      restore_value: no
      initial_value: 'false'

      

